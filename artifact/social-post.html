<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Handmade Bathtub Social Post</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #e9e3d9;
            font-family: Arial, sans-serif;
        }

        .post {
            width: 600px;
            min-height: 760px;
            background: #f7f2e9;
            padding: 55px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #d5cbbd;
        }

        .brand {
            font-size: 12px;
            letter-spacing: 3px;
            font-weight: bold;
        }

        .hero {
            margin-top: 50px;
        }

        .eyebrow {
            font-size: 10px;
            letter-spacing: 2px;
            color: #756b5c;
        }

        h1 {
            font-family: Georgia, serif;
            font-weight: normal;
            font-size: 58px;
            line-height: 1;
            margin: 18px 0;
            color: #28251f;
        }

        .description {
            max-width: 400px;
            font-size: 16px;
            line-height: 1.6;
            color: #5f584e;
        }

        .product {
            margin: 40px 0;
            height: 210px;
            border: 1px solid #cfc4b4;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, serif;
            font-size: 25px;
            color: #8a7b67;
        }

        .cta {
            border-top: 1px solid #cfc4b4;
            padding-top: 25px;
            font-size: 13px;
            letter-spacing: 1px;
        }

        .cta strong {
            display: block;
            margin-bottom: 8px;
        }

    </style>
</head>

<body>

    <div class="post">

        <div class="brand">
            HANDMADE BATHTUB
        </div>

        <div class="hero">

            <div class="eyebrow">
                HANDMADE STONE PRODUCT
            </div>

            <h1>
                Stone,<br>
                shaped by hand.
            </h1>

            <p class="description">
                A considered piece for spaces where material,
                form and craftsmanship matter.
            </p>

            <div class="product">
                Handmade Stone Basin
            </div>

        </div>

        <div class="cta">

            <strong>
                PLANNING A PROJECT?
            </strong>

            Share your quantity, destination,
            timeline and budget to begin an inquiry.

        </div>

    </div>

</body>
</html>
